services:
  postgres:
    image: postgres:16-alpine
    container_name: sellez-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sellez}
      POSTGRES_USER: ${POSTGRES_USER:-sellez}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sellez}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sellez_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sellez} -d ${POSTGRES_DB:-sellez}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sellez_pgdata:
