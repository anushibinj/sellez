plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    // Imports the Spring Boot BOM so starters and their transitive libraries need no explicit versions
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sellez'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    implementation 'software.amazon.awssdk:ses:2.28.29'
    implementation 'software.amazon.awssdk:sns:2.28.29'
    implementation 'software.amazon.awssdk:s3:2.28.29'
    implementation 'com.google.firebase:firebase-admin:9.2.0'
    implementation 'net.coobird:thumbnailator:0.4.20'
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    // Compile-time only; never packaged into the boot JAR
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.zonky.test:embedded-database-spring-test:2.6.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

tasks.named('test') {
    useJUnitPlatform()
}

// Skip the "-plain.jar" so build/libs holds exactly one JAR (the Dockerfile copies it by wildcard)
tasks.named('jar') {
    enabled = false
}
