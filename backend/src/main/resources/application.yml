server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: sellez-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sellez}
    username: ${DATABASE_USERNAME:sellez}
    password: ${DATABASE_PASSWORD:sellez}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:8MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:20MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

sellez:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt-secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-samesite: ${COOKIE_SAMESITE:Lax}
    cookie-domain: ${COOKIE_DOMAIN:}
    access-cookie-name: ${ACCESS_COOKIE_NAME:sellez_access}
    refresh-cookie-name: ${REFRESH_COOKIE_NAME:sellez_refresh}
  auth:
    otp-ttl-minutes: ${OTP_TTL_MINUTES:10}
    otp-max-attempts: ${OTP_MAX_ATTEMPTS:5}
    otp-send-limit: ${OTP_SEND_LIMIT:5}
    otp-send-window-minutes: ${OTP_SEND_WINDOW_MINUTES:10}
    otp-fixed-code: ${OTP_FIXED_CODE:}
  super-admin:
    emails: ${SUPER_ADMIN_EMAILS:owner@sellez.local}
  storage:
    type: ${STORAGE_TYPE:local}
    local-path: ${STORAGE_LOCAL_PATH:./uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/api/media}
    image-max-dimension: ${STORAGE_IMAGE_MAX_DIMENSION:1600}
    image-quality: ${STORAGE_IMAGE_QUALITY:0.82}
    s3:
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:us-east-1}
      endpoint: ${S3_ENDPOINT:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style-access: ${S3_PATH_STYLE_ACCESS:false}
      public-base-url: ${S3_PUBLIC_BASE_URL:}
    firebase:
      bucket: ${FIREBASE_STORAGE_BUCKET:}
      credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  email:
    provider: ${EMAIL_PROVIDER:logging}
    from: ${EMAIL_FROM:noreply@sellez.local}
    aws-region: ${AWS_REGION:us-east-1}
    sns-topic-arn: ${SNS_TOPIC_ARN:}
  listing:
    max-images: ${LISTING_MAX_IMAGES:6}
    currencies: ${LISTING_CURRENCIES:USD,INR,EUR,GBP,AED,CAD,AUD}
    default-currency: ${LISTING_DEFAULT_CURRENCY:USD}
  chat:
    max-image-bytes: ${CHAT_MAX_IMAGE_BYTES:5242880}
  jobs:
    ban-expiry-ms: ${BAN_EXPIRY_JOB_MS:60000}
